spring.application.name=tiendavideojuegos

# --- Base de datos (valores en el fichero .env, que NO se sube a git) ---
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=${DB_DRIVER:org.mariadb.jdbc.Driver}
spring.datasource.hikari.maximum-pool-size=10

# --- JPA: el esquema lo crea schema.sql, Hibernate no toca las tablas ---
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# --- Ejecuta schema.sql y data.sql en cada arranque (OJO: recrea las tablas y borra los datos) ---
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8

# --- Internacionalización / mensajes de validación {msg.xxx} ---
spring.messages.basename=messages
spring.messages.encoding=UTF-8

# --- Subida de imágenes (carátulas de videojuegos) ---
app.upload-dir=${UPLOAD_PATH:uploads}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
