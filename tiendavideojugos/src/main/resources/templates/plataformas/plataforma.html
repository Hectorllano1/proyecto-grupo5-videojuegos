<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head th:replace="~{fragments/head :: head('Plataformas')}"></head>
<body>
<header th:replace="~{fragments/header :: header}"></header>

<main class="container my-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="mb-0">Listado de Plataformas</h1>
        <a th:href="@{/plataformas/nuevo}" class="btn btn-primary">+ Nueva plataforma</a>
    </div>

    <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert" th:text="${successMessage}"></div>
    <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show" role="alert" th:text="${errorMessage}"></div>

    <div class="table-responsive">
        <table class="table table-bordered table-hover align-middle">
            <thead class="table-light">
            <tr>
                <th>ID</th>
                <th>Nombre</th>
                <th>Fabricante</th>
                <th>Generación</th>
                <th>Fecha de lanzamiento</th>
                <th>Portátil</th>
                <th>Acciones</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="p : ${plataformas}">
                <td th:text="${p.id}">1</td>
                <td th:text="${p.nombre}">PlayStation 5</td>
                <td th:text="${p.fabricante}">Sony</td>
                <td th:text="${p.generacion}">Novena</td>
                <td th:text="${p.fechaLanzamiento}">2020-11-12</td>
                <td>
                    <span class="badge"
                          th:classappend="${p.esPortatil} ? 'bg-success' : 'bg-secondary'"
                          th:text="${p.esPortatil} ? 'Sí' : 'No'">No</span>
                </td>
                <td>
                    <div class="d-flex gap-1">
                        <a th:href="@{/plataformas/editar/{id}(id=${p.id})}" class="btn btn-secondary btn-sm">Editar</a>
                        <form th:action="@{/plataformas/eliminar/{id}(id=${p.id})}" method="post" class="d-inline">
                            <button type="submit"
                                    class="btn btn-danger btn-sm"
                                    onclick="return confirm('¿Seguro que deseas eliminar esta plataforma?');">
                                Eliminar
                            </button>
                        </form>
                    </div>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(plataformas)}">
                <td colspan="7" class="text-center text-muted py-4">No hay plataformas registradas todavía.</td>
            </tr>
            </tbody>
        </table>
    </div>
</main>

<footer th:replace="~{fragments/footer :: footer}"></footer>
</body>
</html>
