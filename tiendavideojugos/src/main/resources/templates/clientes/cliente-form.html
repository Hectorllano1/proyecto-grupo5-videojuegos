<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head th:replace="~{fragments/head :: head(${cliente.id == null} ? 'Nuevo Cliente' : 'Editar Cliente')}"></head>
<body>
<header th:replace="~{fragments/header :: header}"></header>

<main class="container my-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="mb-0" th:text="${cliente.id == null} ? 'Alta de Cliente' : 'Edición de Cliente'">Formulario de Cliente</h1>
        <a th:href="@{/clientes}" class="btn btn-outline-secondary">Volver al listado</a>
    </div>

    <form th:action="@{/clientes/guardar}" th:object="${cliente}" method="post" class="card shadow-sm p-4">
        <input type="hidden" th:field="*{id}"/>

        <div th:if="${#fields.hasErrors('*')}" class="alert alert-danger" role="alert">
            <p class="fw-bold mb-1">Por favor, corrige los siguientes errores:</p>
            <ul class="mb-0">
                <li th:each="err : ${#fields.allErrors()}" th:text="${err}"></li>
            </ul>
        </div>

        <div class="mb-3">
            <label for="nombre" class="form-label">Nombre *</label>
            <input id="nombre" type="text" th:field="*{nombre}" class="form-control"
                   th:classappend="${#fields.hasErrors('nombre')} ? 'is-invalid'"/>
            <div class="invalid-feedback" th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}"></div>
        </div>

        <div class="mb-3">
            <label for="apellidos" class="form-label">Apellidos *</label>
            <input id="apellidos" type="text" th:field="*{apellidos}" class="form-control"
                   th:classappend="${#fields.hasErrors('apellidos')} ? 'is-invalid'"/>
            <div class="invalid-feedback" th:if="${#fields.hasErrors('apellidos')}" th:errors="*{apellidos}"></div>
        </div>

        <div class="row g-3 mb-3">
            <div class="col-md-6">
                <label for="dni" class="form-label">DNI *</label>
                <input id="dni" type="text" th:field="*{dni}" placeholder="12345678A" class="form-control"
                       th:classappend="${#fields.hasErrors('dni')} ? 'is-invalid'"/>
                <div class="invalid-feedback" th:if="${#fields.hasErrors('dni')}" th:errors="*{dni}"></div>
            </div>

            <div class="col-md-6">
                <label for="telefono" class="form-label">Teléfono *</label>
                <input id="telefono" type="text" th:field="*{telefono}" placeholder="600123456" class="form-control"
                       th:classappend="${#fields.hasErrors('telefono')} ? 'is-invalid'"/>
                <div class="invalid-feedback" th:if="${#fields.hasErrors('telefono')}" th:errors="*{telefono}"></div>
            </div>
        </div>

        <div class="mb-3">
            <label for="correo" class="form-label">Correo electrónico *</label>
            <input id="correo" type="email" th:field="*{correo}" placeholder="cliente@ejemplo.com" class="form-control"
                   th:classappend="${#fields.hasErrors('correo')} ? 'is-invalid'"/>
            <div class="invalid-feedback" th:if="${#fields.hasErrors('correo')}" th:errors="*{correo}"></div>
        </div>

        <div class="row g-3 mb-3 align-items-center">
            <div class="col-md-6">
                <label for="fechaRegistro" class="form-label">Fecha de registro *</label>
                <input id="fechaRegistro" type="date" th:field="*{fechaRegistro}" class="form-control"
                       th:classappend="${#fields.hasErrors('fechaRegistro')} ? 'is-invalid'"/>
                <div class="invalid-feedback" th:if="${#fields.hasErrors('fechaRegistro')}" th:errors="*{fechaRegistro}"></div>
            </div>

            <div class="col-md-6">
                <div class="form-check mt-md-4">
                    <input id="esPremium" type="checkbox" th:field="*{esPremium}" class="form-check-input"/>
                    <label for="esPremium" class="form-check-label">Cliente Premium</label>
                </div>
            </div>
        </div>

        <div class="mb-4">
            <label for="direccion" class="form-label">Dirección postal</label>
            <input id="direccion" type="text" th:field="*{direccion}" class="form-control"
                   th:classappend="${#fields.hasErrors('direccion')} ? 'is-invalid'"/>
            <div class="invalid-feedback" th:if="${#fields.hasErrors('direccion')}" th:errors="*{direccion}"></div>
        </div>

        <div class="d-flex gap-2">
            <button type="submit" class="btn btn-primary">Guardar</button>
            <a th:href="@{/clientes}" class="btn btn-secondary">Cancelar</a>
        </div>
    </form>
</main>

<footer th:replace="~{fragments/footer :: footer}"></footer>
</body>
</html>
