<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head th:replace="~{fragments/head :: head('Clientes')}"></head>
<body>
<header th:replace="~{fragments/header :: header}"></header>

<main class="container my-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="mb-0">Listado de Clientes</h1>
        <a th:href="@{/clientes/nuevo}" class="btn btn-primary">+ Nuevo cliente</a>
    </div>

    <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert" th:text="${successMessage}"></div>
    <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show" role="alert" th:text="${errorMessage}"></div>

    <div class="table-responsive">
        <table class="table table-bordered table-hover align-middle">
            <thead class="table-light">
            <tr>
                <th>ID</th>
                <th>Nombre completo</th>
                <th>DNI</th>
                <th>Correo</th>
                <th>Teléfono</th>
                <th>Fecha registro</th>
                <th>Dirección</th>
                <th>Premium</th>
                <th>Acciones</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="c : ${clientes}">
                <td th:text="${c.id}">1</td>
                <td th:text="${c.nombreCompleto}">Ana López Pérez</td>
                <td th:text="${c.dni}">12345678A</td>
                <td th:text="${c.correo}">ana@ejemplo.com</td>
                <td th:text="${c.telefono}">600123456</td>
                <td th:text="${c.fechaRegistro}">2026-01-10</td>
                <td th:text="${c.direccion != null and !#strings.isEmpty(c.direccion)} ? ${c.direccion} : '-'">-</td>
                <td>
                    <span class="badge"
                          th:classappend="${c.esPremium} ? 'bg-success' : 'bg-secondary'"
                          th:text="${c.esPremium} ? 'Sí' : 'No'">No</span>
                </td>
                <td>
                    <div class="d-flex gap-1">
                        <a th:href="@{/clientes/editar/{id}(id=${c.id})}" class="btn btn-secondary btn-sm">Editar</a>
                        <form th:action="@{/clientes/eliminar/{id}(id=${c.id})}" method="post" class="d-inline">
                            <button type="submit"
                                    class="btn btn-danger btn-sm"
                                    onclick="return confirm('¿Seguro que deseas eliminar este cliente?');">
                                Eliminar
                            </button>
                        </form>
                    </div>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(clientes)}">
                <td colspan="9" class="text-center text-muted py-4">No hay clientes registrados todavía.</td>
            </tr>
            </tbody>
        </table>
    </div>
</main>

<footer th:replace="~{fragments/footer :: footer}"></footer>
</body>
</html>
