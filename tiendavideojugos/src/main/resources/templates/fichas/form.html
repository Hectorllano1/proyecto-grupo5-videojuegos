<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head th:replace="~{fragments/head :: head(${fichaTecnica.id == null ? 'Nueva ficha técnica' : 'Editar ficha técnica'})}"></head>
<body>
<header th:replace="~{fragments/header :: header}"></header>
<main>
    <h1 th:text="${fichaTecnica.id == null} ? 'Nueva ficha técnica' : 'Editar ficha técnica'">Ficha técnica</h1>

    <div th:if="${#fields.hasErrors('${fichaTecnica.*}')}">
        Hay errores en el formulario. Revisa los campos marcados.
    </div>

    <form th:action="@{/fichas/guardar}" th:object="${fichaTecnica}" method="post" novalidate>
        <input type="hidden" th:field="*{id}">

        <div>
            <div>
                <label for="sistemaOperativo">Sistema operativo *</label>
                <input type="text" id="sistemaOperativo" th:field="*{sistemaOperativo}" maxlength="80">
                <span th:if="${#fields.hasErrors('sistemaOperativo')}" th:errors="*{sistemaOperativo}"></span>
            </div>
            <div>
                <label for="procesador">Procesador *</label>
                <input type="text" id="procesador" th:field="*{procesador}" maxlength="100">
                <span th:if="${#fields.hasErrors('procesador')}" th:errors="*{procesador}"></span>
            </div>
        </div>

        <div>
            <div>
                <label for="memoriaRamGb">Memoria RAM (GB) *</label>
                <input type="number" min="1" id="memoriaRamGb" th:field="*{memoriaRamGb}">
                <span th:if="${#fields.hasErrors('memoriaRamGb')}" th:errors="*{memoriaRamGb}"></span>
            </div>
            <div>
                <label for="espacioDiscoGb">Espacio en disco (GB) *</label>
                <input type="number" min="1" id="espacioDiscoGb" th:field="*{espacioDiscoGb}">
                <span th:if="${#fields.hasErrors('espacioDiscoGb')}" th:errors="*{espacioDiscoGb}"></span>
            </div>
        </div>

        <div>
            <label>
                <input type="checkbox" th:field="*{requiereInternet}">
                Requiere conexión a internet
            </label>
        </div>

        <div>
            <button type="submit">Guardar</button>
            <a th:href="@{/fichas}">Cancelar</a>
        </div>
    </form>
</main>
<footer th:replace="~{fragments/footer :: footer}"></footer>
</body>
</html>
