<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head th:replace="~{fragments/head :: head('Fichas técnicas')}"></head>
<body>
<header th:replace="~{fragments/header :: header}"></header>
<main class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="mb-0">Fichas técnicas</h1>
        <a th:href="@{/fichas/nuevo}" class="btn btn-primary">+ Nueva ficha</a>
    </div>

    <div th:if="${exito}" class="alert alert-success" th:text="${exito}"></div>
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <div th:if="${#lists.isEmpty(fichas)}" class="alert alert-info">Todavía no hay fichas técnicas registradas.</div>

    <div th:unless="${#lists.isEmpty(fichas)}" class="table-responsive">
        <table class="table table-bordered table-hover align-middle">
            <thead class="table-light">
            <tr>
                <th>Videojuego</th>
                <th>Sistema operativo</th>
                <th>Procesador</th>
                <th>RAM</th>
                <th>Disco</th>
                <th>Internet</th>
                <th>Acciones</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="f : ${fichas}">
                <td>
                    <span th:if="${f.videojuego != null}" th:text="${f.videojuego.titulo}">Juego</span>
                    <span th:if="${f.videojuego == null}" class="text-muted">Sin asignar</span>
                </td>
                <td th:text="${f.sistemaOperativo}">SO</td>
                <td th:text="${f.procesador}">CPU</td>
                <td th:text="${f.memoriaRamGb} + ' GB'">8 GB</td>
                <td th:text="${f.espacioDiscoGb} + ' GB'">50 GB</td>
                <td>
                    <span th:if="${f.requiereInternet}" class="badge bg-success">Sí</span>
                    <span th:unless="${f.requiereInternet}" class="badge bg-secondary">No</span>
                </td>
                <td class="text-nowrap">
                    <a th:href="@{/fichas/editar/{id}(id=${f.id})}" class="btn btn-secondary btn-sm">Editar</a>
                    <form th:action="@{/fichas/eliminar/{id}(id=${f.id})}" method="post" class="d-inline"
                          onsubmit="return confirm('¿Eliminar esta ficha técnica?');">
                        <button type="submit" class="btn btn-danger btn-sm">Eliminar</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</main>
<footer th:replace="~{fragments/footer :: footer}"></footer>
</body>
</html>
