<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head th:replace="~{fragments/head :: head('Fichas técnicas')}"></head>
<body>
<header th:replace="~{fragments/header :: header}"></header>
<main>
    <div>
        <h1>Fichas técnicas</h1>
        <a th:href="@{/fichas/nuevo}">+ Nueva ficha</a>
    </div>

    <p th:if="${exito}" th:text="${exito}"></p>
    <p th:if="${error}" th:text="${error}"></p>

    <p th:if="${#lists.isEmpty(fichas)}">Todavía no hay fichas técnicas registradas.</p>

    <div th:unless="${#lists.isEmpty(fichas)}">
        <table>
            <thead>
            <tr>
                <th>Videojuego</th>
                <th>Sistema operativo</th>
                <th>Procesador</th>
                <th>RAM</th>
                <th>Disco</th>
                <th>Internet</th>
                <th>Acciones</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="f : ${fichas}">
                <td>
                    <span th:if="${f.videojuego != null}" th:text="${f.videojuego.titulo}">Juego</span>
                    <span th:if="${f.videojuego == null}">Sin asignar</span>
                </td>
                <td th:text="${f.sistemaOperativo}">SO</td>
                <td th:text="${f.procesador}">CPU</td>
                <td th:text="${f.memoriaRamGb} + ' GB'">8 GB</td>
                <td th:text="${f.espacioDiscoGb} + ' GB'">50 GB</td>
                <td>
                    <span th:if="${f.requiereInternet}">Sí</span>
                    <span th:unless="${f.requiereInternet}">No</span>
                </td>
                <td>
                    <a th:href="@{/fichas/editar/{id}(id=${f.id})}">Editar</a>
                    <form th:action="@{/fichas/eliminar/{id}(id=${f.id})}" method="post"
                          onsubmit="return confirm('¿Eliminar esta ficha técnica?');">
                        <button type="submit">Eliminar</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</main>
<footer th:replace="~{fragments/footer :: footer}"></footer>
</body>
</html>
