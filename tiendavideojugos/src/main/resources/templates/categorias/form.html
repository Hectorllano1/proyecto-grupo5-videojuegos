<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head th:replace="~{fragments/layout :: head(${categoria.id == null ? 'Nueva categoría' : 'Editar categoría'})}"></head>
<body>
<header th:replace="~{fragments/layout :: cabecera}"></header>
<main class="contenedor">
    <h1 th:text="${categoria.id == null} ? 'Nueva categoría' : 'Editar categoría'">Categoría</h1>

    <div class="alerta error" th:if="${#fields.hasErrors('${categoria.*}')}">
        Hay errores en el formulario. Revisa los campos marcados.
    </div>

    <form th:action="@{/categorias/guardar}" th:object="${categoria}" method="post" class="formulario" novalidate>
        <input type="hidden" th:field="*{id}">

        <div class="campo">
            <label for="nombre">Nombre *</label>
            <input type="text" id="nombre" th:field="*{nombre}" maxlength="60"
                   th:classappend="${#fields.hasErrors('nombre')} ? 'invalido'">
            <span class="msg-error" th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}"></span>
        </div>

        <div class="campo">
            <label for="descripcion">Descripción *</label>
            <textarea id="descripcion" th:field="*{descripcion}" rows="3" maxlength="300"
                      th:classappend="${#fields.hasErrors('descripcion')} ? 'invalido'"></textarea>
            <span class="msg-error" th:if="${#fields.hasErrors('descripcion')}" th:errors="*{descripcion}"></span>
        </div>

        <div class="campo campo-check">
            <label>
                <input type="checkbox" th:field="*{activa}">
                Categoría activa
            </label>
        </div>

        <div class="botones">
            <button type="submit" class="btn btn-primario">Guardar</button>
            <a class="btn btn-secundario" th:href="@{/categorias}">Cancelar</a>
        </div>
    </form>
</main>
<footer th:replace="~{fragments/layout :: pie}"></footer>
</body>
</html>
