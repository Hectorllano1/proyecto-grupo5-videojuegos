<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head th:replace="~{fragments/head :: head(${categoria.id == null ? 'Nueva categoría' : 'Editar categoría'})}"></head>
<body>
<header th:replace="~{fragments/header :: header}"></header>
<main>
    <h1 th:text="${categoria.id == null} ? 'Nueva categoría' : 'Editar categoría'">Categoría</h1>

    <div th:if="${#fields.hasErrors('${categoria.*}')}">
        Hay errores en el formulario. Revisa los campos marcados.
    </div>

    <form th:action="@{/categorias/guardar}" th:object="${categoria}" method="post" novalidate>
        <input type="hidden" th:field="*{id}">

        <div>
            <label for="nombre">Nombre *</label>
            <input type="text" id="nombre" th:field="*{nombre}" maxlength="60">
            <span th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}"></span>
        </div>

        <div>
            <label for="descripcion">Descripción *</label>
            <textarea id="descripcion" th:field="*{descripcion}" rows="3" maxlength="300"></textarea>
            <span th:if="${#fields.hasErrors('descripcion')}" th:errors="*{descripcion}"></span>
        </div>

        <div>
            <label>
                <input type="checkbox" th:field="*{activa}">
                Categoría activa
            </label>
        </div>

        <div>
            <button type="submit">Guardar</button>
            <a th:href="@{/categorias}">Cancelar</a>
        </div>
    </form>
</main>
<footer th:replace="~{fragments/footer :: footer}"></footer>
</body>
</html>
