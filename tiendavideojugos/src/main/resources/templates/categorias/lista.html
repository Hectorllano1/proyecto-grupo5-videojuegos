<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head th:replace="~{fragments/head :: head('Categorías')}"></head>
<body>
<header th:replace="~{fragments/header :: header}"></header>
<main>
    <div>
        <h1>Categorías</h1>
        <a th:href="@{/categorias/nuevo}">+ Nueva categoría</a>
    </div>

    <p th:if="${exito}" th:text="${exito}"></p>
    <p th:if="${error}" th:text="${error}"></p>

    <p th:if="${#lists.isEmpty(categorias)}">Todavía no hay categorías registradas.</p>

    <div th:unless="${#lists.isEmpty(categorias)}">
        <table>
            <thead>
            <tr>
                <th>Nombre</th>
                <th>Descripción</th>
                <th>Activa</th>
                <th>Nº de videojuegos</th>
                <th>Acciones</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="c : ${categorias}">
                <td th:text="${c.nombre}">Nombre</td>
                <td th:text="${c.descripcion}">Descripción</td>
                <td>
                    <span th:if="${c.activa}">Sí</span>
                    <span th:unless="${c.activa}">No</span>
                </td>
                <td th:text="${#lists.size(c.videojuegos)}">0</td>
                <td>
                    <a th:href="@{/categorias/editar/{id}(id=${c.id})}">Editar</a>
                    <form th:action="@{/categorias/eliminar/{id}(id=${c.id})}" method="post"
                          onsubmit="return confirm('¿Eliminar esta categoría?');">
                        <button type="submit">Eliminar</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</main>
<footer th:replace="~{fragments/footer :: footer}"></footer>
</body>
</html>
