<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head th:replace="~{fragments/head :: head('Categorías')}"></head>
<body>
<header th:replace="~{fragments/header :: header}"></header>
<main class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="mb-0">Categorías</h1>
        <a th:href="@{/categorias/nuevo}" class="btn btn-primary">+ Nueva categoría</a>
    </div>

    <div th:if="${exito}" class="alert alert-success" th:text="${exito}"></div>
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <div th:if="${#lists.isEmpty(categorias)}" class="alert alert-info">Todavía no hay categorías registradas.</div>

    <div th:unless="${#lists.isEmpty(categorias)}" class="table-responsive">
        <table class="table table-bordered table-hover align-middle">
            <thead class="table-light">
            <tr>
                <th>Nombre</th>
                <th>Descripción</th>
                <th>Activa</th>
                <th>Nº de videojuegos</th>
                <th>Acciones</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="c : ${categorias}">
                <td th:text="${c.nombre}">Nombre</td>
                <td th:text="${c.descripcion}">Descripción</td>
                <td>
                    <span th:if="${c.activa}" class="badge bg-success">Sí</span>
                    <span th:unless="${c.activa}" class="badge bg-secondary">No</span>
                </td>
                <td th:text="${#lists.size(c.videojuegos)}">0</td>
                <td class="text-nowrap">
                    <a th:href="@{/categorias/editar/{id}(id=${c.id})}" class="btn btn-secondary btn-sm">Editar</a>
                    <form th:action="@{/categorias/eliminar/{id}(id=${c.id})}" method="post" class="d-inline"
                          onsubmit="return confirm('¿Eliminar esta categoría?');">
                        <button type="submit" class="btn btn-danger btn-sm">Eliminar</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</main>
<footer th:replace="~{fragments/footer :: footer}"></footer>
</body>
</html>
