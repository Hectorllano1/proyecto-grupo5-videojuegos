<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head th:replace="~{fragments/head :: head(${videojuego.id == null ? 'Nuevo videojuego' : 'Editar videojuego'})}"></head>
<body>
<header th:replace="~{fragments/header :: header}"></header>
<main class="container mt-4">
    <h1 class="mb-3" th:text="${videojuego.id == null} ? 'Nuevo videojuego' : 'Editar videojuego'">Videojuego</h1>

    <div th:if="${#fields.hasErrors('${videojuego.*}')}" class="alert alert-danger">
        Hay errores en el formulario. Revisa los campos marcados.
    </div>

    <!-- Un único formulario para alta y edición: si hay id oculto, se edita; si no, se crea -->
    <form th:action="@{/videojuegos/guardar}" th:object="${videojuego}" method="post"
          enctype="multipart/form-data" novalidate class="card card-body">
        <input type="hidden" th:field="*{id}">

        <div class="mb-3">
            <label for="titulo" class="form-label">Título *</label>
            <input type="text" id="titulo" th:field="*{titulo}" maxlength="120" class="form-control">
            <div class="text-danger small" th:if="${#fields.hasErrors('titulo')}" th:errors="*{titulo}"></div>
        </div>

        <div class="mb-3">
            <label for="descripcion" class="form-label">Descripción *</label>
            <textarea id="descripcion" th:field="*{descripcion}" rows="4" maxlength="1000" class="form-control"></textarea>
            <div class="text-danger small" th:if="${#fields.hasErrors('descripcion')}" th:errors="*{descripcion}"></div>
        </div>

        <div class="row g-3 mb-3">
            <div class="col-md-4">
                <label for="precio" class="form-label">Precio (€) *</label>
                <input type="number" step="0.01" min="0" id="precio" th:field="*{precio}" class="form-control">
                <div class="text-danger small" th:if="${#fields.hasErrors('precio')}" th:errors="*{precio}"></div>
            </div>
            <div class="col-md-4">
                <label for="stock" class="form-label">Stock *</label>
                <input type="number" step="1" min="0" id="stock" th:field="*{stock}" class="form-control">
                <div class="text-danger small" th:if="${#fields.hasErrors('stock')}" th:errors="*{stock}"></div>
            </div>
            <div class="col-md-4">
                <label for="fechaLanzamiento" class="form-label">Fecha de lanzamiento *</label>
                <input type="date" id="fechaLanzamiento" th:field="*{fechaLanzamiento}" class="form-control">
                <div class="text-danger small" th:if="${#fields.hasErrors('fechaLanzamiento')}" th:errors="*{fechaLanzamiento}"></div>
            </div>
        </div>

        <div class="row g-3 mb-3">
            <!-- ManyToOne: elegir una categoría ya existente -->
            <div class="col-md-6">
                <label for="categoria" class="form-label">Categoría *</label>
                <select id="categoria" name="categoria.id" class="form-select">
                    <option value="">-- Selecciona una categoría --</option>
                    <option th:each="c : ${categorias}" th:value="${c.id}"
                            th:text="${c.nombre}"
                            th:selected="${videojuego.categoria != null and videojuego.categoria.id == c.id}"></option>
                </select>
                <div class="text-danger small" th:if="${#fields.hasErrors('categoria')}" th:errors="*{categoria}"></div>
            </div>

            <!-- OneToOne: elegir una ficha técnica libre (opcional) -->
            <div class="col-md-6">
                <label for="fichaTecnica" class="form-label">Ficha técnica</label>
                <select id="fichaTecnica" name="fichaTecnica.id" class="form-select">
                    <option value="">-- Sin ficha técnica --</option>
                    <option th:each="f : ${fichas}" th:value="${f.id}"
                            th:text="${f.resumen}"
                            th:selected="${videojuego.fichaTecnica != null and videojuego.fichaTecnica.id == f.id}"></option>
                </select>
                <div class="text-danger small" th:if="${#fields.hasErrors('fichaTecnica')}" th:errors="*{fichaTecnica}"></div>
                <div class="form-text">Solo aparecen las fichas que aún no están asignadas.
                    <a th:href="@{/fichas/nuevo}">Crear ficha</a></div>
            </div>
        </div>

        <div class="row g-3 mb-3">
            <!-- ManyToOne opcional: plataforma -->
            <div class="col-md-6">
                <label for="plataforma" class="form-label">Plataforma</label>
                <select id="plataforma" name="plataforma.id" class="form-select">
                    <option value="">-- Sin plataforma --</option>
                    <option th:each="p : ${plataformas}" th:value="${p.id}"
                            th:text="${p.nombre}"
                            th:selected="${videojuego.plataforma != null and videojuego.plataforma.id == p.id}"></option>
                </select>
            </div>

            <!-- ManyToOne opcional: desarrolladora -->
            <div class="col-md-6">
                <label for="desarrolladora" class="form-label">Desarrolladora</label>
                <select id="desarrolladora" name="desarrolladora.id" class="form-select">
                    <option value="">-- Sin desarrolladora --</option>
                    <option th:each="d : ${desarrolladoras}" th:value="${d.id}"
                            th:text="${d.nombre}"
                            th:selected="${videojuego.desarrolladora != null and videojuego.desarrolladora.id == d.id}"></option>
                </select>
            </div>
        </div>

        <div class="form-check mb-3">
            <input type="checkbox" id="esMultijugador" th:field="*{esMultijugador}" class="form-check-input">
            <label for="esMultijugador" class="form-check-label">Tiene modo multijugador</label>
        </div>

        <div class="mb-3">
            <label for="archivoImagen" class="form-label">Carátula (jpg, png, gif o webp · máx. 5 MB)</label>
            <div th:if="${videojuego.imagen != null}" class="d-flex align-items-center gap-3 mb-2">
                <img th:src="@{'/uploads/' + ${videojuego.imagen}}" alt="Imagen actual" class="img-thumbnail" width="96">
                <span class="form-text">Imagen actual. Sube otra para sustituirla.</span>
            </div>
            <input type="file" id="archivoImagen" name="archivoImagen" accept="image/*" class="form-control">
            <div class="text-danger small" th:if="${#fields.hasErrors('imagen')}" th:errors="*{imagen}"></div>
        </div>

        <div class="d-flex gap-2">
            <button type="submit" class="btn btn-primary">Guardar</button>
            <a th:href="@{/videojuegos}" class="btn btn-secondary">Cancelar</a>
        </div>
    </form>
</main>
<footer th:replace="~{fragments/footer :: footer}"></footer>
</body>
</html>
