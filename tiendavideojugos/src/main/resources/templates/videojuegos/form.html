<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head th:replace="~{fragments/head :: head(${videojuego.id == null ? 'Nuevo videojuego' : 'Editar videojuego'})}"></head>
<body>
<header th:replace="~{fragments/header :: header}"></header>
<main>
    <h1 th:text="${videojuego.id == null} ? 'Nuevo videojuego' : 'Editar videojuego'">Videojuego</h1>

    <div th:if="${#fields.hasErrors('${videojuego.*}')}">
        Hay errores en el formulario. Revisa los campos marcados.
    </div>

    <!-- Un único formulario para alta y edición: si hay id oculto, se edita; si no, se crea -->
    <form th:action="@{/videojuegos/guardar}" th:object="${videojuego}" method="post"
          enctype="multipart/form-data" novalidate>
        <input type="hidden" th:field="*{id}">

        <div>
            <label for="titulo">Título *</label>
            <input type="text" id="titulo" th:field="*{titulo}" maxlength="120">
            <span th:if="${#fields.hasErrors('titulo')}" th:errors="*{titulo}"></span>
        </div>

        <div>
            <label for="descripcion">Descripción *</label>
            <textarea id="descripcion" th:field="*{descripcion}" rows="4" maxlength="1000"></textarea>
            <span th:if="${#fields.hasErrors('descripcion')}" th:errors="*{descripcion}"></span>
        </div>

        <div>
            <div>
                <label for="precio">Precio (€) *</label>
                <input type="number" step="0.01" min="0" id="precio" th:field="*{precio}">
                <span th:if="${#fields.hasErrors('precio')}" th:errors="*{precio}"></span>
            </div>
            <div>
                <label for="stock">Stock *</label>
                <input type="number" step="1" min="0" id="stock" th:field="*{stock}">
                <span th:if="${#fields.hasErrors('stock')}" th:errors="*{stock}"></span>
            </div>
            <div>
                <label for="fechaLanzamiento">Fecha de lanzamiento *</label>
                <input type="date" id="fechaLanzamiento" th:field="*{fechaLanzamiento}">
                <span th:if="${#fields.hasErrors('fechaLanzamiento')}" th:errors="*{fechaLanzamiento}"></span>
            </div>
        </div>

        <div>
            <!-- ManyToOne: elegir una categoría ya existente -->
            <div>
                <label for="categoria">Categoría *</label>
                <select id="categoria" name="categoria.id">
                    <option value="">-- Selecciona una categoría --</option>
                    <option th:each="c : ${categorias}" th:value="${c.id}"
                            th:text="${c.nombre}"
                            th:selected="${videojuego.categoria != null and videojuego.categoria.id == c.id}"></option>
                </select>
                <span th:if="${#fields.hasErrors('categoria')}" th:errors="*{categoria}"></span>
            </div>

            <!-- OneToOne: elegir una ficha técnica libre (opcional) -->
            <div>
                <label for="fichaTecnica">Ficha técnica</label>
                <select id="fichaTecnica" name="fichaTecnica.id">
                    <option value="">-- Sin ficha técnica --</option>
                    <option th:each="f : ${fichas}" th:value="${f.id}"
                            th:text="${f.resumen}"
                            th:selected="${videojuego.fichaTecnica != null and videojuego.fichaTecnica.id == f.id}"></option>
                </select>
                <span th:if="${#fields.hasErrors('fichaTecnica')}" th:errors="*{fichaTecnica}"></span>
                <small>Solo aparecen las fichas que aún no están asignadas. <a th:href="@{/fichas/nuevo}">Crear ficha</a></small>
            </div>
        </div>

        <div>
            <!-- ManyToOne opcional: plataforma -->
            <div>
                <label for="plataforma">Plataforma</label>
                <select id="plataforma" name="plataforma.id">
                    <option value="">-- Sin plataforma --</option>
                    <option th:each="p : ${plataformas}" th:value="${p.id}"
                            th:text="${p.nombre}"
                            th:selected="${videojuego.plataforma != null and videojuego.plataforma.id == p.id}"></option>
                </select>
            </div>

            <!-- ManyToOne opcional: desarrolladora -->
            <div>
                <label for="desarrolladora">Desarrolladora</label>
                <select id="desarrolladora" name="desarrolladora.id">
                    <option value="">-- Sin desarrolladora --</option>
                    <option th:each="d : ${desarrolladoras}" th:value="${d.id}"
                            th:text="${d.nombre}"
                            th:selected="${videojuego.desarrolladora != null and videojuego.desarrolladora.id == d.id}"></option>
                </select>
            </div>
        </div>

        <div>
            <label>
                <input type="checkbox" th:field="*{esMultijugador}">
                Tiene modo multijugador
            </label>
        </div>

        <div>
            <label for="archivoImagen">Carátula (jpg, png, gif o webp · máx. 5 MB)</label>
            <div th:if="${videojuego.imagen != null}">
                <img th:src="@{'/uploads/' + ${videojuego.imagen}}" alt="Imagen actual">
                <small>Imagen actual. Sube otra para sustituirla.</small>
            </div>
            <input type="file" id="archivoImagen" name="archivoImagen" accept="image/*">
            <span th:if="${#fields.hasErrors('imagen')}" th:errors="*{imagen}"></span>
        </div>

        <div>
            <button type="submit">Guardar</button>
            <a th:href="@{/videojuegos}">Cancelar</a>
        </div>
    </form>
</main>
<footer th:replace="~{fragments/footer :: footer}"></footer>
</body>
</html>
