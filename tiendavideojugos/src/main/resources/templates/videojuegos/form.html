<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head th:replace="~{fragments/layout :: head(${videojuego.id == null ? 'Nuevo videojuego' : 'Editar videojuego'})}"></head>
<body>
<header th:replace="~{fragments/layout :: cabecera}"></header>
<main class="contenedor">
    <h1 th:text="${videojuego.id == null} ? 'Nuevo videojuego' : 'Editar videojuego'">Videojuego</h1>

    <div class="alerta error" th:if="${#fields.hasErrors('${videojuego.*}')}">
        Hay errores en el formulario. Revisa los campos marcados.
    </div>

    <!-- Un único formulario para alta y edición: si hay id oculto, se edita; si no, se crea -->
    <form th:action="@{/videojuegos/guardar}" th:object="${videojuego}" method="post"
          enctype="multipart/form-data" class="formulario" novalidate>
        <input type="hidden" th:field="*{id}">

        <div class="campo">
            <label for="titulo">Título *</label>
            <input type="text" id="titulo" th:field="*{titulo}" maxlength="120"
                   th:classappend="${#fields.hasErrors('titulo')} ? 'invalido'">
            <span class="msg-error" th:if="${#fields.hasErrors('titulo')}" th:errors="*{titulo}"></span>
        </div>

        <div class="campo">
            <label for="descripcion">Descripción *</label>
            <textarea id="descripcion" th:field="*{descripcion}" rows="4" maxlength="1000"
                      th:classappend="${#fields.hasErrors('descripcion')} ? 'invalido'"></textarea>
            <span class="msg-error" th:if="${#fields.hasErrors('descripcion')}" th:errors="*{descripcion}"></span>
        </div>

        <div class="fila">
            <div class="campo">
                <label for="precio">Precio (€) *</label>
                <input type="number" step="0.01" min="0" id="precio" th:field="*{precio}"
                       th:classappend="${#fields.hasErrors('precio')} ? 'invalido'">
                <span class="msg-error" th:if="${#fields.hasErrors('precio')}" th:errors="*{precio}"></span>
            </div>
            <div class="campo">
                <label for="stock">Stock *</label>
                <input type="number" step="1" min="0" id="stock" th:field="*{stock}"
                       th:classappend="${#fields.hasErrors('stock')} ? 'invalido'">
                <span class="msg-error" th:if="${#fields.hasErrors('stock')}" th:errors="*{stock}"></span>
            </div>
            <div class="campo">
                <label for="fechaLanzamiento">Fecha de lanzamiento *</label>
                <input type="date" id="fechaLanzamiento" th:field="*{fechaLanzamiento}"
                       th:classappend="${#fields.hasErrors('fechaLanzamiento')} ? 'invalido'">
                <span class="msg-error" th:if="${#fields.hasErrors('fechaLanzamiento')}" th:errors="*{fechaLanzamiento}"></span>
            </div>
        </div>

        <div class="fila">
            <!-- ManyToOne: elegir una categoría ya existente -->
            <div class="campo">
                <label for="categoria">Categoría *</label>
                <select id="categoria" name="categoria.id"
                        th:classappend="${#fields.hasErrors('categoria')} ? 'invalido'">
                    <option value="">-- Selecciona una categoría --</option>
                    <option th:each="c : ${categorias}" th:value="${c.id}"
                            th:text="${c.nombre}"
                            th:selected="${videojuego.categoria != null and videojuego.categoria.id == c.id}"></option>
                </select>
                <span class="msg-error" th:if="${#fields.hasErrors('categoria')}" th:errors="*{categoria}"></span>
            </div>

            <!-- OneToOne: elegir una ficha técnica libre (opcional) -->
            <div class="campo">
                <label for="fichaTecnica">Ficha técnica</label>
                <select id="fichaTecnica" name="fichaTecnica.id"
                        th:classappend="${#fields.hasErrors('fichaTecnica')} ? 'invalido'">
                    <option value="">-- Sin ficha técnica --</option>
                    <option th:each="f : ${fichas}" th:value="${f.id}"
                            th:text="${f.resumen}"
                            th:selected="${videojuego.fichaTecnica != null and videojuego.fichaTecnica.id == f.id}"></option>
                </select>
                <span class="msg-error" th:if="${#fields.hasErrors('fichaTecnica')}" th:errors="*{fichaTecnica}"></span>
                <small class="ayuda">Solo aparecen las fichas que aún no están asignadas. <a th:href="@{/fichas/nuevo}">Crear ficha</a></small>
            </div>
        </div>

        <div class="campo campo-check">
            <label>
                <input type="checkbox" th:field="*{esMultijugador}">
                Tiene modo multijugador
            </label>
        </div>

        <div class="campo">
            <label for="archivoImagen">Carátula (jpg, png, gif o webp · máx. 5 MB)</label>
            <div th:if="${videojuego.imagen != null}" class="imagen-actual">
                <img th:src="@{'/uploads/' + ${videojuego.imagen}}" alt="Imagen actual" class="miniatura">
                <small>Imagen actual. Sube otra para sustituirla.</small>
            </div>
            <input type="file" id="archivoImagen" name="archivoImagen" accept="image/*">
            <span class="msg-error" th:if="${#fields.hasErrors('imagen')}" th:errors="*{imagen}"></span>
        </div>

        <div class="botones">
            <button type="submit" class="btn btn-primario">Guardar</button>
            <a class="btn btn-secundario" th:href="@{/videojuegos}">Cancelar</a>
        </div>
    </form>
</main>
<footer th:replace="~{fragments/layout :: pie}"></footer>
</body>
</html>
