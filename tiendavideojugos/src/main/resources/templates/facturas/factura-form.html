<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head th:replace="~{fragments/head :: head(${factura.id == null} ? 'Nueva Factura' : 'Editar Factura')}"></head>
<body>
<header th:replace="~{fragments/header :: header}"></header>

<main class="container main-content">
    <div class="page-header">
        <h1 th:text="${factura.id == null} ? 'Alta de Factura' : 'Edición de Factura'">Formulario de Factura</h1>
    </div>

    <form th:action="@{/facturas/guardar}" th:object="${factura}" method="post" class="form-card">
        <input type="hidden" th:field="*{id}"/>

        <div th:if="${#fields.hasErrors('*')}" class="alert alert-error">
            <p><strong>Por favor, corrige los siguientes errores:</strong></p>
            <ul>
                <li th:each="err : ${#fields.allErrors()}" th:text="${err}"></li>
            </ul>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label for="numeroFactura">Número de factura *</label>
                <input id="numeroFactura" type="text" th:field="*{numeroFactura}" placeholder="FAC-2026-001" class="form-control"/>
                <span class="field-error" th:if="${#fields.hasErrors('numeroFactura')}" th:errors="*{numeroFactura}"></span>
            </div>

            <div class="form-group">
                <label for="pedido">Pedido asociado *</label>
                <select id="pedido" th:field="*{pedido.id}" class="form-control">
                    <option value="">-- Selecciona un pedido --</option>
                    <option th:each="p : ${pedidos}"
                            th:value="${p.id}"
                            th:text="'Pedido #' + ${p.id} + ' - ' + ${p.cliente.nombreCompleto} + ' (' + ${#numbers.formatDecimal(p.precioTotal, 1, 2)} + ' €)'">
                    </option>
                </select>
                <span class="field-error" th:if="${#fields.hasErrors('pedido')}" th:errors="*{pedido}"></span>
            </div>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label for="fechaEmision">Fecha de emisión *</label>
                <input id="fechaEmision" type="date" th:field="*{fechaEmision}" class="form-control"/>
                <span class="field-error" th:if="${#fields.hasErrors('fechaEmision')}" th:errors="*{fechaEmision}"></span>
            </div>

            <div class="form-group">
                <label for="importeTotal">Importe total (€) *</label>
                <input id="importeTotal" type="number" step="0.01" min="0.00" th:field="*{importeTotal}" class="form-control"/>
                <span class="field-error" th:if="${#fields.hasErrors('importeTotal')}" th:errors="*{importeTotal}"></span>
            </div>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label for="metodoPago">Método de pago</label>
                <input id="metodoPago" type="text" th:field="*{metodoPago}" placeholder="Tarjeta, Bizum, Transferencia..." class="form-control"/>
                <span class="field-error" th:if="${#fields.hasErrors('metodoPago')}" th:errors="*{metodoPago}"></span>
            </div>

            <div class="form-group checkbox-group">
                <label class="checkbox-label">
                    <input type="checkbox" th:field="*{pagada}"/>
                    <span>Factura pagada</span>
                </label>
            </div>
        </div>

        <div class="form-actions">
            <button type="submit" class="btn btn-primary">Guardar</button>
            <a th:href="@{/templates/facturas}" class="btn btn-secondary">Cancelar</a>
        </div>
    </form>
</main>

<footer th:replace="~{fragments/footer :: footer}"></footer>
</body>
</html>
