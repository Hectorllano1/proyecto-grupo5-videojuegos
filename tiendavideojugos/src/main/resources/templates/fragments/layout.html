<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<!-- Fragmentos comunes: cabecera <head>, menú, mensajes y pie. Se reutilizan en todas las pantallas. -->

<head th:fragment="head(titulo)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${titulo} + ' · GameStore'">GameStore</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<header th:fragment="cabecera" class="cabecera">
    <div class="contenedor barra">
        <a th:href="@{/}" class="logo">🎮 GameStore</a>
        <nav>
            <a th:href="@{/videojuegos}">Videojuegos</a>
            <a th:href="@{/categorias}">Categorías</a>
            <a th:href="@{/fichas}">Fichas técnicas</a>
        </nav>
    </div>
</header>

<div th:fragment="mensajes">
    <div class="alerta exito" th:if="${exito}" th:text="${exito}"></div>
    <div class="alerta error" th:if="${error}" th:text="${error}"></div>
</div>

<footer th:fragment="pie" class="pie">
    <div class="contenedor">
        <p>GameStore · UD04 Acceso a datos y persistencia · Spring Boot + JPA + Thymeleaf</p>
    </div>
</footer>

</html>
